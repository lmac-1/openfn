on:
  push:
    branches:
      - main

concurrency:
  group: openfn-deployment
  cancel-in-progress: false

jobs:
  deploy-to-lightning:
    runs-on: ubuntu-latest
    name: A job to deploy to Lightning
    permissions:
      contents: write
    steps:
      - name: openfn deploy
        uses: openfn/cli-deploy-action@v1.0.0
        with:
          secret_input: ${{ secrets.OPENFN_2ef0f0bd_3665_4927_bfb8_45c8e5b8be1f_API_KEY }}
          config_path_input: 'openfn-2ef0f0bd-3665-4927-bfb8-45c8e5b8be1f-config.json'
